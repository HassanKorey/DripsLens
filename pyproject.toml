[project]
name = "dripslens"
version = "2.0.0"
description = "Soroban Smart Contract & Stellar Analytics Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "httpx",
    "apscheduler",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "stellar-sdk",
    "tenacity",
    "sse-starlette"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
