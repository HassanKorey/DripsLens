[project]
name = "dripslens"
version = "2.0.0"
description = "Soroban Smart Contract & Stellar Analytics Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite",
    "alembic",
    "httpx",
    "apscheduler",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "stellar-sdk",
    "tenacity",
    "sse-starlette"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
