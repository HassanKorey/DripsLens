[project]
name = "drips-lens"
version = "0.1.0"
description = "Aggregates, caches and serves data about Drips Wave (Stellar) approved repositories"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
