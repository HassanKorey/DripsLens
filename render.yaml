services:
  - type: web
    name: drips-lens
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drips-lens-db
          property: connectionString
      # REDIS_URL is optional: when unset the app serves cacheable endpoints
      # straight from Postgres (just slower). Add it manually in the Render
      # dashboard to enable the Redis cache layer.
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: drips-lens-db
    databaseName: dripslens
    user: drips
